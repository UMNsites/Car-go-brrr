<style>

@media (orientation:portrait){
 #wb{width:132px;height:132px}#ib{bottom:146px}#ib button{width:50px;height:50px}
 #pBk{width:50px;height:76px}#pGs{width:56px;height:92px}
 #bHB{right:calc(118px + env(safe-area-inset-right,0px));width:46px;height:86px}
 #gb{bottom:102px}#gb button,#gb .lab{min-width:38px;height:42px}#bS{bottom:154px;width:52px;height:52px}
 #obj{max-width:48vw;font-size:11px}#tst{top:calc(136px + env(safe-area-inset-top,0px))}

<body>
<canvas id="cv"></canvas>
<div id="err"><span id="errm"></span></div>

<div id="hud" class="hid">

 <div id="wb"><svg viewBox="-90 -90 180 180"><g id="wr">
  <circle r="78" fill="rgba(15,16,19,.6)" stroke="#0b0c0e" stroke-width="14"/>
  <circle r="66" fill="none" stroke="#23262b" stroke-width="10"/>
  <rect x="-58" y="-5" width="116" height="10" rx="5" fill="#23262b"/>
  <rect x="-5" y="10" width="10" height="64" rx="5" fill="#23262b"/>
  <circle r="20" fill="#1a1c20"/><rect x="-3" y="-82" width="6" height="12" rx="3" fill="#f2a33c"/>
 </g></svg></div>
 <div id="ib"><button id="iL">←</button><button id="iR">→</button></div>

</div>

<div class="ov" id="menu"><div class="sh">
 <div><h1><em>MINI</em> DRIVER</h1><div class="sub">DRIVING SCHOOL</div></div><div class="rule"></div>
 <button class="row" id="mLes"><div><b>LESSONS</b><span>Five coached chapters, lot to bay park</span></div><i id="lTag">0 / 5</i></button>
 <button class="row" id="mTst"><div><b>DRIVING TEST</b><span>Examiner aboard · stop sign · slalom · bay</span></div><i id="tTag">NOT TRIED</i></button>
 <button class="row" id="mFree"><div><b>FREE DRIVE</b><span>The whole course, nothing graded</span></div></button>
 <div class="foot"><button class="tgl" id="tS">SOUND <b>ON</b></button><button class="tgl" id="tT">GEARBOX <b>AUTO</b></button></div>
 <div class="hint">Turn your phone sideways. Drag the wheel to steer — no buttons. Pedals on the right. Signal before turns; it clicks off by itself after the corner. Foot on BRAKE + ENGINE to start.</div>
</div></div>

<div class="ov ct hid" id="les"><div class="sh"><h2>LESSONS</h2><div class="s2">Take them in order.</div><div id="lList"></div><button class="btn g" id="lesB">BACK</button></div></div>
<div class="ov ct hid" id="brf"><div class="sh"><h2 id="bT2"></h2><div class="s2" id="bS2"></div><ul class="ck" id="bL"></ul><div class="s2" id="bG"></div>
 <div class="brow"><button class="btn g" id="bB">BACK</button><button class="btn" id="bGo" style="flex:2">START</button></div></div></div>
<div class="ov ct hid" id="deb"><div class="sh"><h2 id="dT2"></h2><div class="s2" id="dL2"></div><div id="dS" class="stars"></div><div id="dF"></div>
 <div class="brow"><button class="btn g" id="dM">MENU</button><button class="btn g hid" id="dN">NEXT</button><button class="btn" id="dR">AGAIN</button></div></div></div>
<div class="ov ct hid" id="pau"><div class="sh"><h2>PAUSED</h2>
 <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><button class="btn" id="pRes">RESUME</button><button class="btn g" id="pRe">RESTART</button><button class="btn g" id="pMn">EXIT TO MENU</button></div>
</div></div>

<script>
window.onerror=function(m,l){var e=document.getElementById('err');e.style.display='block';document.getElementById('errm').textContent='Error: '+m+' line '+l};
try{(function(){
'use strict';
/* ---------- helpers ---------- */
var $=function(q){return document.querySelector(q)};
var TAU=Math.PI*2,PI=Math.PI;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function angN(a){while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a}
var rs=9;function rng(){rs|=0;rs=rs+0x6D2B79F5|0;var t=Math.imul(rs^rs>>>15,1|rs);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
var save={snd:1,trn:'AT',st:{},tt:null};
try{var sv=JSON.parse(localStorage.getItem('mdv3'));if(sv)for(var k in sv)save[k]=sv[k]}catch(e){}
function per(){try{localStorage.setItem('mdv3',JSON.stringify(save))}catch(e){}}
/* ---------- audio ---------- */
var S={c:null};
S.en=function(){if(S.c){if(S.c.state==='suspended')S.c.resume();return}
 var A=window.AudioContext||window.webkitAudioContext;if(!A)return;var x=S.c=new A();
 S.m=x.createGain();S.m.gain.value=save.snd?0.8:0;S.m.connect(x.destination);
 var b=x.createBuffer(1,x.sampleRate,x.sampleRate),d=b.getChannelData(0);
 for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;S.n=b;
 var eg=x.createGain();eg.gain.value=0;var fl=x.createBiquadFilter();fl.type='lowpass';fl.frequency.value=250;
 var o1=x.createOscillator();o1.type='sawtooth';var o2=x.createOscillator();o2.type='square';
 var g=x.createGain();g.gain.value=.35;o1.connect(g);o2.connect(g);g.connect(fl);
 var ns=x.createBufferSource();ns.buffer=b;ns.loop=true;var ng=x.createGain();ng.gain.value=.04;ns.connect(ng);ng.connect(fl);
 fl.connect(eg);eg.connect(S.m);o1.start();o2.start();ns.start();S.e=eg;S.f=fl;S.o1=o1;S.o2=o2};
S.eng=function(rpm,th,on){if(!S.c)return;var t=S.c.currentTime,f=Math.max(18,rpm/60*2);
 S.o1.frequency.setTargetAtTime(f*2,t,.05);S.o2.frequency.setTargetAtTime(f*3,t,.05);
 S.f.frequency.setTargetAtTime(150+rpm*.07+th*400,t,.06);
 S.e.gain.setTargetAtTime(on?(.05+th*.08):0,t,.06)};
S.bl=function(f,d,v,ty,dl){if(!S.c)return;var t=S.c.currentTime+(dl||0),o=S.c.createOscillator(),g=S.c.createGain();
 o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);g.connect(S.m);o.start(t);o.stop(t+d+.02)};
S.nz=function(f,d,v,dl){if(!S.c)return;var t=S.c.currentTime+(dl||0),s=S.c.createBufferSource();s.buffer=S.n;
 var fl=S.c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;var g=S.c.createGain();
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(fl);fl.connect(g);g.connect(S.m);s.start(t);s.stop(t+d+.02)};
var sfx={tick:function(a){S.bl(a?1250:900,.04,.05,'square')},
 clunk:function(){S.nz(300,.07,.2);S.bl(160,.06,.1,'square')},
 buzz:function(){S.bl(150,.15,.07,'square')},
 crank:function(){for(var i=0;i<7;i++)S.bl(290,.03,.09,'square',i*.09)},
 sput:function(){for(var i=0;i<3;i++)S.bl(90,.12,.2,'sawtooth',i*.15)},
 cone:function(){S.nz(700,.08,.16)},
 thud:function(){S.bl(75,.22,.3);S.nz(280,.12,.25)},
 ding:function(){S.bl(1050,.15,.09);S.bl(1550,.2,.09,'sine',.09)},
 chime:function(){S.bl(880,.1,.05)},
 chord:function(ok){(ok?[523,659,784]:[392,330,262]).forEach(function(f,i){S.bl(f,.35,.1,'triangle',i*.1)})},
 rat:function(){for(var i=0;i<3;i++)S.bl(340,.03,.08,'square',i*.05)}};
/* ---------- renderer (custom canvas 3D, no libraries) ---------- */
var cv=$('#cv'),ctx=cv.getContext('2d'),W=0,H=0,F=100,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,1.6);W=innerWidth;H=innerHeight;
 cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);F=H*0.95}
addEventListener('resize',resize);resize();
var cam={x:0,y:1.1,z:0,h:0,p:0},shC=0,chC=1,spC=0,cpC=1;
function setCam(c){cam=c;shC=Math.sin(c.h);chC=Math.cos(c.h);spC=Math.sin(c.p||0);cpC=Math.cos(c.p||0)}
function camPt(x,y,z){var dx=x-cam.x,dy=y-cam.y,dz=z-cam.z;
 return[dx*chC-dz*shC,dy,dx*shC+dz*chC]}
function projCam(x,y,z){var c=camPt(x,y,z),y2=c[1]+c[2]*spC,z2=c[2]-c[1]*spC;
 if(z2<0.15)return null;return[W/2+c[0]/z2*F,H/2-y2/z2*F,z2]}
function clipProj(pts){var cs=[],i,p;
 for(i=0;i<pts.length;i++){p=camPt(pts[i][0],pts[i][1],pts[i][2]);
  cs.push([p[0],p[1]+p[2]*spC,p[2]-p[1]*spC])}
 var out=[];
 for(i=0;i<cs.length;i++){var a=cs[i],b=cs[(i+1)%cs.length],ai=a[2]>0.15,bi=b[2]>0.15;
  if(ai)out.push(a);
  if(ai!==bi){var t=(0.15-a[2])/(b[2]-a[2]);
   out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,0.15])}}
 if(out.length<3)return null;var zd=0;
 for(i=0;i<out.length;i++)zd+=out[i][2];
 return{p:out,d:zd/out.length}}
function drawPath(p){ctx.beginPath();
 for(var i=0;i<p.length;i++){var sx=W/2+p[i][0]/p[i][2]*F,sy=H/2-p[i][1]/p[i][2]*F;
  if(i)ctx.lineTo(sx,sy);else ctx.moveTo(sx,sy)}
 ctx.closePath()}
var SHC={};
function shd(c,f){var k=c+f;if(SHC[k])return SHC[k];
 var r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
 return SHC[k]='rgb('+Math.min(255,r*f|0)+','+Math.min(255,g*f|0)+','+Math.min(255,b*f|0)+')'}
function gpoly(pts,col){var r=clipProj(pts);if(!r)return;drawPath(r.p);ctx.fillStyle=col;ctx.fill()}
var RL=[];
function face(pts,col){var r=clipProj(pts);if(r)RL.push({p:r.p,c:col,d:r.d})}
function gcirc(x,z,r,col){var pts=[];for(var i=0;i<12;i++){var a=i/12*TAU;
 pts.push([x+Math.cos(a)*r,0.03,z+Math.sin(a)*r])}gpoly(pts,col)}
function cbill(x,y,z,r,col){var p=projCam(x,y,z);
 if(p)RL.push({cc:[p[0],p[1],r/p[2]*F],c:col,d:p[2]})}

   P.x=sp.x;P.z=sp.z;P.h=sp.h;P.vx=P.vz=P.vF=P.vL=0;$('#fade').style.opacity=0}
  return}
 var info=dg();
 var target=clamp(wheelDeg/150,-1,1);
 if(!wheelHeld){var rate=(26+Math.abs(P.vF)*13)*dt;
  wheelDeg-=Math.sign(wheelDeg)*Math.min(Math.abs(wheelDeg),rate)}
 target=Math.sign(target)*Math.pow(Math.abs(target),.9);
 P.stv+=(target-P.stv)*Math.min(1,dt*10);
 var eff=P.stv*0.58/(1+0.012*P.vF*P.vF);
 P.h=angN(P.h-(P.vF/2.45)*Math.tan(eff)*dt);
 var fx=Math.sin(P.h),fz=Math.cos(P.h);
 var vF=P.vx*fx+P.vz*fz,vL=P.vx*(-fz)+P.vz*fx;
 var off=!onRoad(P.x,P.z,0.3);
 var a=0,th=P.thr,br=P.brk;
 if(P.crk>0){P.crk-=dt;if(P.crk<=0){P.eng=true;updStart();S.bl(70,.3,.2,'sawtooth')}}
 if(P.eng&&info.r>0&&P.cut<=0){
  var mx=info.n=='R'?2.8:ACC[parseInt(info.n,10)-1];
  var drive=th*mx*clamp(P.rpm/2400,0.35,1)*(off?0.6:1);
  if(info.n=='R'&&vF<-4.5)drive=0;
  a+=(info.n=='R'?-1:1)*drive}
 if(P.eng&&P.trn=='AT'&&P.sel=='D'&&!P.hb&&br<0.1&&vF>-0.05&&vF<1.4)a+=0.45*(1.4-vF);
 if(br>0)a-=Math.sign(vF)*Math.min(Math.abs(vF)/dt,br*8.5);

 if(P.eng&&th<0.05&&info.r>0&&Math.abs(vF)>0.3)a-=Math.sign(vF)*(0.3+0.3*info.r/3.8);
 vF+=a*dt;
 if(!gasIn&&!brkIn&&Math.abs(vF)<0.12)vF=0;

 P.vx=fx*vF-fz*vL;P.vz=fz*vF+fx*vL;

  else P.rpm=lerp(P.rpm,850+th*2600,Math.min(1,dt*3));

function collide(){var r=0.95,hit=0,i;

  var cx=clamp(P.x,b.x0,b.x1),cz=clamp(P.z,b.z0,b.z1);
  var dx=P.x-cx,dz=P.z-cz,d=Math.hypot(dx,dz);
  if(d<r){var nx,nz;
   if(d<1e-4){var p1=P.x-b.x0,p2=b.x1-P.x,p3=P.z-b.z0,p4=b.z1-P.z,m=Math.min(p1,p2,p3,p4);
    nx=m==p1?-1:m==p2?1:0;nz=nx==0?(m==p3?-1:1):0;P.x+=nx*(m+r);P.z+=nz*(m+r)}
   else{nx=dx/d;nz=dz/d;P.x=cx+nx*r;P.z=cz+nz*r}
   var vn=P.vx*nx+P.vz*nz;
   if(vn<0){P.vx-=nx*vn*1.5;P.vz-=nz*vn*1.5;hit=Math.max(hit,-vn)}}}
 for(i=0;i<SOL.c.length;i++){var c=SOL.c[i];
  var dx2=P.x-c.x,dz2=P.z-c.z,rr=r+c.r,d2=dx2*dx2+dz2*dz2;
  if(d2<rr*rr&&d2>1e-6){var dd=Math.sqrt(d2),nx2=dx2/dd,nz2=dz2/dd;

   if(vn2<0){P.vx-=nx2*vn2*1.5;P.vz-=nz2*vn2*1.5;hit=Math.max(hit,-vn2)}}}
 for(i=0;i<TRF.length;i++){var t=TRF[i];
  var dx3=P.x-t.x,dz3=P.z-t.z,d3=dx3*dx3+dz3*dz3;

  if(M&&M.def.id!=='test'&&!M.def.free){minor('Collision');respT=0.9;$('#fade').style.opacity=1}
  else if(M&&M.def.id==='test')major('Collision')}}

 flush();
 if(clip)ctx.restore()}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
 ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function cockpit(){
 ctx.fillStyle='#0d0e11';
 ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,H);ctx.lineTo(30,H);ctx.lineTo(12,0);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(W,H);ctx.lineTo(W-30,H);ctx.lineTo(W-12,0);ctx.closePath();ctx.fill();
 ctx.fillRect(0,0,W,20);
 ctx.fillStyle='#15171b';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H-56);
 ctx.quadraticCurveTo(W/2,H-86,W,H-56);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#23262c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,H-56);
 ctx.quadraticCurveTo(W/2,H-86,W,H-56);ctx.stroke()}
function cluster(){kmhD=lerp(kmhD,kmh(),.25);rpmD=lerp(rpmD,P.rpm,.3);
 var cw=Math.min(178,W*.44),chh=56,x=W/2-cw/2,y=H-chh-8;
 rrect(x,y,cw,chh,12);ctx.fillStyle='rgba(10,11,14,.88)';ctx.fill();
 ctx.strokeStyle='#33373e';ctx.lineWidth=1.5;ctx.stroke();
 ctx.textAlign='center';ctx.fillStyle='#efe9dc';
 ctx.font='700 28px "Avenir Next Condensed","Arial Narrow",sans-serif';
 ctx.fillText(Math.round(kmhD),x+cw*.3,y+33);
 ctx.font='600 9px Barlow,Arial';ctx.fillStyle='#8b9097';ctx.fillText('km/h',x+cw*.3,y+45);
 ctx.fillStyle='#22262c';ctx.fillRect(x+cw*.52,y+11,cw*.4,7);
 ctx.fillStyle=P.rpm>6300?'#e5533f':'#f2a33c';
 ctx.fillRect(x+cw*.52,y+11,cw*.4*clamp(rpmD/7200,0,1),7);
 ctx.font='700 20px "Avenir Next Condensed","Arial Narrow",sans-serif';
 ctx.fillStyle='#efe9dc';ctx.fillText(gearLabel(),x+cw*.72,y+42);
 if(P.hb){ctx.fillStyle='#e5533f';ctx.font='700 9px Barlow,Arial';
  ctx.fillText('PARK',x+cw*.72,y+16)}
 if(!P.eng){ctx.fillStyle='#e5533f';ctx.font='700 9px Barlow,Arial';
  ctx.fillText('ENGINE OFF',x+cw*.52,y+32)}}
function render(t){
 if(mode==='drive'){
  var brkD=0.03+0.03*brkS-0.012*P.thr;
  var shx=(Math.random()-.5)*shake*.08;
  render3D({x:P.x+0.37*Math.cos(P.h)+0.05*Math.sin(P.h)+shx*Math.cos(P.h),
   y:1.08+(Math.random()-.5)*shake*.05,
   z:P.z-0.37*Math.sin(P.h)+0.05*Math.cos(P.h),h:P.h,p:brkD},false,null);
  cockpit();
  var mr=[W/2-72,30,144,40];
  render3D({x:P.x,y:1.34,z:P.z,h:P.h+PI,p:0.04},true,mr);
  ctx.strokeStyle='#0a0b0d';ctx.lineWidth=5;ctx.strokeRect(mr[0],mr[1],mr[2],mr[3]);
  if(inRev()&&P.eng){var rv=[W/2-76,H-198,152,92];
   render3D({x:P.x-1.9*Math.sin(P.h),y:0.95,z:P.z-1.9*Math.cos(P.h),h:P.h+PI,p:0.18},true,rv);
   ctx.strokeStyle='#0a0b0d';ctx.lineWidth=4;ctx.strokeRect(rv[0],rv[1],rv[2],rv[3]);
   ctx.strokeStyle='rgba(242,163,60,.8)';ctx.lineWidth=2;ctx.beginPath();
   ctx.moveTo(rv[0]+30,rv[1]+rv[3]-8);ctx.lineTo(rv[0]+58,rv[1]+18);
   ctx.moveTo(rv[0]+rv[2]-30,rv[1]+rv[3]-8);ctx.lineTo(rv[0]+rv[2]-58,rv[1]+18);ctx.stroke()}
  cluster()}
 else{var a=t*8e-5+2.4,ox=P.x+Math.sin(a)*9.5,oz=P.z+Math.cos(a)*9.5;
  render3D({x:ox,y:2.6,z:oz,h:Math.atan2(P.x-ox,P.z-oz),p:-0.15},true,null)}}
/* ---------- menus & wiring ---------- */
function tap(el,fn){var lt=0;
 el.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();
  var n=performance.now();if(n-lt<500)return;lt=n;S.en();fn(e)});
 el.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();
  var n=performance.now();if(n-lt<500)return;lt=n;S.en();fn(e)})}
function renderMenu(){var n=0;
 MISIONS.slice(0,5).forEach(function(m){if(save.st[m.id])n++});
 $('#lTag').textContent=n+' / 5';
 var tt=$('#tTag');
 if(save.tt){tt.textContent='PASS · '+save.tt.m+' MIN';tt.classList.add('ok')}
 else{tt.textContent='NOT TRIED';tt.classList.remove('ok')}
 var so=save.snd?'ON':'OFF',tr=save.trn=='AT'?'AUTO':'MANUAL';
 $('#tS').innerHTML='SOUND <b>'+so+'</b>';$('#tT').innerHTML='GEARBOX <b>'+tr+'</b>';
 var ll=$('#lList');ll.innerHTML='';
 MISIONS.slice(0,5).forEach(function(m){var b=document.createElement('button');b.className='lrow';
  var s=save.st[m.id]||0;
  b.innerHTML='<span class="ln">'+m.num+'</span><div><b>'+m.title+'</b><span>'+m.sub+'</span></div>'+
   '<i class="'+(s?'y':'')+'">'+(s?'\u2605\u2605\u2605':'\u2606\u2606\u2606')+'</i>';
  tap(b,function(){showBrief(m)});ll.appendChild(b)})}
function showBrief(def){$('#les').classList.add('hid');$('#menu').classList.add('hid');
 $('#brf').classList.remove('hid');
 $('#bT2').textContent=(def.num?def.num+' · ':'')+def.title;
 $('#bS2').textContent=def.sub;
 $('#bL').innerHTML=def.br.map(function(t){return'<li>'+t+'</li>'}).join('');
 $('#bG').textContent=def.mt?'Gearbox: MANUAL (fixed for this lesson)':
  'Gearbox: '+(save.trn=='AT'?'AUTOMATIC':'MANUAL')+' — change it in the menu';
 pendingDef=def}
var pendingDef=null;
tap($('#mLes'),function(){$('#menu').classList.add('hid');$('#les').classList.remove('hid');renderMenu()});
tap($('#lesB'),function(){$('#les').classList.add('hid');$('#menu').classList.remove('hid')});
tap($('#mTst'),function(){showBrief(MISIONS[5])});
tap($('#mFree'),function(){startMission(FREE)});
tap($('#bB'),function(){$('#brf').classList.add('hid');$('#menu').classList.remove('hid')});
tap($('#bGo'),function(){if(pendingDef)startMission(pendingDef)});
tap($('#dR'),function(){if(M)startMission(M.def);else toMenu()});
tap($('#dM'),toMenu);
tap($('#pRes'),function(){paused=false;$('#pau').classList.add('hid')});
tap($('#pRe'),function(){$('#pau').classList.add('hid');if(M)startMission(M.def);else toMenu()});
tap($('#pMn'),toMenu);
tap($('#bP'),function(){if(mode!=='drive')return;paused=true;$('#pau').classList.remove('hid')});
tap($('#tS'),function(){save.snd=save.snd?0:1;S.en();if(S.m)S.m.gain.value=save.snd?0.8:0;per();renderMenu()});
tap($('#tT'),function(){save.trn=save.trn=='AT'?'MT':'AT';per();renderMenu()});
document.addEventListener('visibilitychange',function(){
 if(document.hidden&&mode==='drive'&&!paused){paused=true;$('#pau').classList.remove('hid')}});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
/* ---------- main loop ---------- */
var last=0,ftA=0,ftN=0;
function bannerTick(dt){
 if(bnT>0){bnT-=dt;if(bnT<=0)$('#ban').classList.remove('show')}
 if(bnT<=0&&bnQ.length){var m=bnQ.shift();
  $('#bN').textContent=m.r?'EXAMINER RAY':'COACH EVA';
  $('#bTx').textContent=m.t;$('#ban').classList.add('show');
  sfx.chime();bnT=clamp(2+m.t.length*.045,2.6,5.2)}}
function loop(t){requestAnimationFrame(loop);
 var dt=Math.min(.04,(t-last)/1000||.016);last=t;
 ftA+=dt;ftN++;
 if(ftN>=90){if(ftA/ftN>.034&&DPR>1.05){DPR=Math.max(1.05,DPR-.3);resize()}ftA=0;ftN=0}
 shake=Math.max(0,shake-dt*2.2);
 if(mode==='menu'||mode==='debrief'){upTraffic(dt);S.eng(0,0,0)}
 else if(mode==='drive'&&!paused){
  if(M)M.t+=dt;
  inputTick(dt);physics(dt);collide();conesCheck(dt);
  if(M&&respT<0)mTick(dt);
  upTraffic(dt);colCD=Math.max(0,colCD-dt);
  bannerTick(dt);
  S.eng(P.rpm,Math.max(P.thr,.06),P.eng);
  var tg=curTgt();
  if(tg&&M&&!M.def.free){var rel=angN(Math.atan2(tg.x-P.x,tg.z-P.z)-P.h);
   $('#oA').style.transform='rotate('+rel.toFixed(2)+'rad)';
   $('#oD').textContent=Math.round(Math.hypot(tg.x-P.x,tg.z-P.z))+' m'}}
 else if(mode==='drive')S.eng(0,0,0);
 wr.setAttribute('transform','rotate('+wheelDeg.toFixed(1)+')');
 render(t)}
/* ---------- boot ---------- */
renderMenu();toMenu();
requestAnimationFrame(loop);
})()}catch(e){var eb=document.getElementById('err');eb.style.display='block';
 document.getElementById('errm').textContent='Startup failed: '+(e&&e.message||e)}
</script>
